[project]
name = "maison-os"
version = "0.9.5"
description = "Domotique légère de la maison, pilotable par des agents (MCP), branchée sur les briques officielles (Matter Server…)"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "mcp==2.3.0",
  "pyyaml>=6",
  "tinytuya>=1.13",
  "aioesphomeapi>=44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maison*"]

[tool.setuptools.package-data]
"maison.api" = ["static/*.html", "static/*.png"]
