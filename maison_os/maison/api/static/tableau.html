<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="{{house}}">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icone-192.png">
<link rel="apple-touch-icon" href="/icone-192.png">
<title>{{house}}</title>
<style>
  :root {
    --bg1: #fbfaf7; --bg2: #ebe7e0; --text: #1d1d1f; --muted: #6e6e73;
    --card: rgba(255,255,255,.68); --card-line: rgba(255,255,255,.75); --line: rgba(60,60,67,.12);
    --track: rgba(120,120,128,.16); --green: #34c759; --sheet: rgba(255,255,255,.76);
    --seg: rgba(118,118,128,.14); --seg-on: #fff; --shadow: rgba(0,0,0,.10); --ring: #1d1d1f;
    --panel1: #ffffff; --panel2: #e6e1d8;
    font: 100%/1.45 system-ui, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg1: #1c1c1e; --bg2: #0e0e10; --text: #f5f5f7; --muted: #98989d;
      --card: rgba(44,44,46,.62); --card-line: rgba(255,255,255,.08); --line: rgba(84,84,88,.45);
      --track: rgba(120,120,128,.32); --green: #30d158; --sheet: rgba(30,30,32,.78);
      --seg: rgba(118,118,128,.24); --seg-on: #636366; --shadow: rgba(0,0,0,.45); --ring: #f5f5f7;
      --panel1: #2c2e35; --panel2: #151619;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg2); }
  body { min-height: 100dvh; color: var(--text); -webkit-font-smoothing: antialiased;
    background: radial-gradient(120% 60% at 50% 0%, var(--bg1) 0%, var(--bg2) 100%) fixed; overflow-x: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, [tabindex]:focus-visible { outline: 3px solid #0a84ff; outline-offset: 2px; border-radius: 10px; }

  .top { padding: max(22px, env(safe-area-inset-top)) 20px 6px; position: relative; z-index: 3; }
  h1 { font-size: 2.125rem; line-height: 1.05; letter-spacing: -0.022em; font-weight: 700; }
  .sub { margin-top: 4px; font-size: .95rem; color: var(--muted); letter-spacing: -0.005em; min-height: 1.4em; }
  .seg { margin-top: 14px; display: inline-flex; padding: 3px; border-radius: 12px; background: var(--seg); }
  .seg button { padding: 7px 16px; border-radius: 9px; font-size: .875rem; font-weight: 600; color: var(--muted);
    transition: background-color .2s, color .2s, box-shadow .2s; }
  .seg button[aria-selected="true"] { background: var(--seg-on); color: var(--text);
    box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 0 1px rgba(0,0,0,.2); }
  .seg button:active { transform: scale(.97); }

  .wrap { position: relative; width: 100%; height: min(112vw, 58vh); overflow: hidden; touch-action: manipulation; }
  .wrap.night { background: radial-gradient(90% 80% at 50% 40%, #2b2e37 0%, #14151a 100%); border-radius: 28px; margin: 4px 10px 0; width: auto;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); transition: background-color .8s; }
  .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform;
    transition: transform .55s cubic-bezier(.2,.85,.25,1); }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none;
    transition: opacity .35s ease, filter .8s ease; }
  .stage img.old { opacity: 0; }
  .stage.night img { filter: brightness(.42) saturate(.8) contrast(1.05); }
  .glow { position: absolute; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%);
    transition: opacity .45s ease; }
  .stage.night .glow, .stage.night .strip { mix-blend-mode: screen; }
  .strip { position: absolute; pointer-events: none; transform-origin: 0 50%; border-radius: 99px; transition: opacity .45s ease; }
  .spot { position: absolute; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    display: grid; place-items: center; transform: scale(var(--inv, 1)); transition: transform .55s cubic-bezier(.2,.85,.25,1); }
  .spot i { width: 16px; height: 16px; border-radius: 50%; background: rgba(255,255,255,.92);
    box-shadow: 0 0 0 2px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.25); transition: background-color .3s, box-shadow .3s, transform .2s; }
  .spot.on i { background: var(--c); box-shadow: 0 0 0 3px #fff, 0 0 16px 4px var(--c), 0 2px 8px rgba(0,0,0,.25); }
  .spot.off-line i { background: transparent; box-shadow: 0 0 0 2px rgba(255,255,255,.9), 0 0 0 4px rgba(0,0,0,.2); }
  .spot.sel i { transform: scale(1.25); box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--ring), 0 0 16px 4px var(--c, transparent); }
  .spot:active i { transform: scale(.9); }

  .rooms { padding: 8px 16px calc(40px + env(safe-area-inset-bottom)); display: grid; gap: 14px; position: relative; z-index: 2; }
  .room { min-width: 0; overflow: hidden; background: var(--card); border: 1px solid var(--card-line); border-radius: 22px; padding: 6px 0;
    backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); box-shadow: 0 6px 24px var(--shadow); }
  .room h3 { font-size: .75rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 10px 16px 4px; }
  .dev { min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 16px; width: 100%; text-align: left; }
  .dev + .dev { border-top: 1px solid var(--line); }
  .dev .ico { width: 34px; height: 34px; border-radius: 50%; flex: none; background: var(--track); display: grid; place-items: center; }
  .dev .ico svg { width: 18px; height: 18px; stroke: var(--muted); }
  .dev.on .ico { background: var(--c); box-shadow: 0 0 14px -2px var(--c); }
  .dev.on .ico svg { stroke: #1d1d1f; }
  .dev .txt { flex: 1; min-width: 0; display: block; text-align: left; }
  .dev .n { font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev .s { font-size: .82rem; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 30px 10px; }
  .rh { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-right: 10px; }
  .alloff { display: inline-flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 99px; font-size: .78rem; font-weight: 600;
    color: var(--muted); transition: opacity .2s, background .15s; }
  .alloff svg { width: 15px; height: 15px; }
  .room h3 { min-width: 0; }
  .alloff:not(:disabled):hover { background: var(--track); }
  .alloff:active { transform: scale(.96); }
  .alloff:disabled { opacity: .35; }
  /* carte dédiée (fusée) : ciel de nuit */
  .fx { margin: 6px 10px 10px; border-radius: 22px; padding: 18px; color: #f5f5f7; position: relative; overflow: hidden; display: grid; gap: 16px;
    background: radial-gradient(120% 80% at 30% 0%, #22305c, #0d1226 70%); }
  .fx::before { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(1.2px 1.2px at 12% 18%, #fff8, transparent),
    radial-gradient(1px 1px at 72% 12%, #fff9, transparent), radial-gradient(1.5px 1.5px at 85% 40%, #ffd96a, transparent), radial-gradient(1px 1px at 40% 8%, #fff7, transparent),
    radial-gradient(1px 1px at 92% 70%, #fff6, transparent), radial-gradient(1.3px 1.3px at 8% 60%, #fff6, transparent); }
  .fx > * { position: relative; }
  .fx-top { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: center; }
  .fx h4 { font-size: 1.3rem; letter-spacing: -.02em; line-height: 1.15; }
  .fx .st { opacity: .7; font-size: .88rem; margin: 3px 0 12px; }
  .fx .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .fx .lbl { font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; opacity: .6; margin-bottom: 8px; }
  .rk { position: relative; aspect-ratio: 540/1077; --c: #3b82f6; }
  .rk img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .rk .tint, .rk .lum { position: absolute; inset: 0; -webkit-mask: var(--m) center/100% 100% no-repeat; mask: var(--m) center/100% 100% no-repeat; transition: background .4s, opacity .4s; }
  .rk .tint { background: var(--c); mix-blend-mode: color; opacity: .95; }
  .rk .lum { background: radial-gradient(60% 45% at 50% 55%, #fff 0%, transparent 70%); mix-blend-mode: soft-light; opacity: .7; }
  .rk .glow { position: absolute; inset: -20% -60%; background: radial-gradient(closest-side, var(--c), transparent); opacity: .45; filter: blur(18px); transition: opacity .4s, background .4s; }
  .rk.off .tint { background: #1b2030; mix-blend-mode: multiply; opacity: .55; } .rk.off .lum, .rk.off .glow { opacity: 0; }
  .fx-dots { display: grid; grid-template-columns: repeat(5, 30px); gap: 10px 14px; }
  .fx-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .fx-dot.sel { box-shadow: 0 0 0 2px #0d1226, 0 0 0 4px var(--c); }
  .fx-chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .fx-chip { padding: 7px 13px; border-radius: 99px; font-size: .84rem; font-weight: 600; background: rgba(255,255,255,.1); }
  .fx-chip.sel { background: #fff; color: #0d1226; }
  .fx-prog { background: rgba(255,255,255,.07); border-radius: 18px; padding: 12px 14px; display: grid; gap: 10px; }
  .fx-time { display: flex; align-items: center; gap: 2px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .fx-time select { appearance: none; -webkit-appearance: none; background: rgba(255,255,255,.1); color: inherit; border: 0; border-radius: 8px; padding: 4px 6px; font: inherit; }
  .fx-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fx-acts button { background: rgba(255,255,255,.1); border-radius: 14px; padding: 11px; font-weight: 600; font-size: .88rem; }
  .fx-acts .go { grid-column: 1 / -1; background: linear-gradient(90deg, #fb923c, #f97316); color: #1a0f05; }
  .fx button:active { transform: scale(.96); }
  .fx button:disabled, .fx select:disabled { opacity: .4; }
  .fx .switch { flex: none; }
  .fxdlg { border: 0; padding: 0; background: none; width: min(94vw, 400px); max-height: 92dvh; overflow: visible; margin: auto; }
  .fxdlg::backdrop { background: rgba(0,0,0,.45); backdrop-filter: blur(6px); }
  .fxdlg[open] { animation: fxin .32s cubic-bezier(.2,.9,.3,1); }
  @keyframes fxin { from { opacity: 0; transform: translateY(16px) scale(.97); } }
  .fxdlg .fx { margin: 0; max-height: 92dvh; overflow-y: auto; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
  .fx-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(255,255,255,.12);
    display: grid; place-items: center; font-size: 1.1rem; line-height: 1; z-index: 2; }
  .dev .ico.rkt svg { width: 19px; height: 19px; }
  @media (prefers-reduced-motion: reduce) { .fxdlg[open] { animation: none; } }
  .scenes { display: flex; gap: 8px; flex-wrap: wrap; padding: 2px 16px 10px; }
  .scenes button { padding: 7px 14px; border-radius: 99px; font-size: .85rem; font-weight: 600; background: var(--track); }
  .scenes button:active { transform: scale(.96); }
  .scenes button:disabled { opacity: .4; }
  .dev.locked .ico { background: var(--track); box-shadow: none; }
  .dev.locked .n::after { content: " 🔒"; font-size: .8em; }
  .spot.locked i { background: rgba(255,255,255,.6) !important; box-shadow: 0 0 0 2px rgba(0,0,0,.25) !important; }
  .pairbar { margin-top: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); }
  .pairbar[hidden] { display: none; }
  .pairbar button, .dlg .go { padding: 8px 14px; border-radius: 12px; background: #0a84ff; color: #fff; font-weight: 600; }
  .note { margin-top: 14px; font-size: .88rem; color: var(--muted); }
  .dlg { border: 0; border-radius: 24px; padding: 22px; width: min(92vw, 380px); background: var(--bg1); color: var(--text);
    box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .dlg::backdrop { background: rgba(0,0,0,.35); backdrop-filter: blur(4px); }
  .dlg h2 { font-size: 1.25rem; letter-spacing: -0.015em; }
  .dlg p { color: var(--muted); font-size: .88rem; margin-top: 4px; }
  .dlg label { display: block; font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 16px 0 6px; }
  .dlg select, .dlg input { width: 100%; font: inherit; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg2); color: var(--text); }
  .dlg .row2 { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
  .dlg .no { padding: 8px 14px; border-radius: 12px; color: var(--muted); font-weight: 600; }

  .switch { width: 51px; height: 31px; flex: none; border-radius: 99px; background: var(--track); position: relative; transition: background-color .25s; }
  .switch::after { content: ""; position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff;
    box-shadow: 0 3px 8px rgba(0,0,0,.15), 0 1px 1px rgba(0,0,0,.08); transition: transform .3s cubic-bezier(.3,1.4,.6,1); }
  .switch[aria-checked="true"] { background: var(--green); }
  .switch[aria-checked="true"]::after { transform: translateX(20px); }
  .switch:disabled { opacity: .4; }

  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-height: 78dvh; overflow: hidden;
    padding: 8px 20px calc(26px + env(safe-area-inset-bottom)); border-radius: 28px 28px 0 0;
    background: var(--sheet); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 -10px 40px var(--shadow); border-top: 1px solid var(--card-line); transform: translateY(110%); touch-action: none; }
  .sheet[hidden] { display: block; visibility: hidden; }
  .grab { width: 38px; height: 5px; border-radius: 3px; background: rgba(120,120,128,.4); margin: 0 auto 14px; }
  .shead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 2px; cursor: grab; }
  .shead h2 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.015em; line-height: 1.2; }
  .sroom { font-size: .85rem; color: var(--muted); margin-top: 1px; }
  .label { font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 18px 0 8px; }
  .bar { height: 46px; border-radius: 14px; background: var(--track); overflow: hidden; position: relative; touch-action: none; cursor: ew-resize; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: linear-gradient(90deg, var(--c1, #ffe2b8), var(--c2, #ffbf66)); }
  .bar b { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: .95rem; font-weight: 600; color: #1d1d1f; mix-blend-mode: normal; }
  .temp { height: 30px; border-radius: 99px; position: relative; touch-action: none; cursor: ew-resize; margin: 0 4px;
    background: linear-gradient(90deg, #ffa95a, #ffe7cc 45%, #f4f4f2 62%, #cfe0ff); }
  .temp em { position: absolute; top: 50%; left: 30%; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%;
    border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); background: var(--k, #ffc27a); }
  .swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .swatches button { width: 33px; height: 33px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.1); transition: transform .15s; }
  .swatches button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg1), 0 0 0 5px var(--ring); }
  .swatches button:active { transform: scale(.9); }
  .hold { margin-top: 18px; padding: 14px; border-radius: 16px; background: rgba(255,159,10,.14); }
  .hold p { font-size: .9rem; font-weight: 600; }
  .hold form { display: flex; gap: 8px; margin-top: 10px; }
  .hold input { flex: 1; min-width: 0; font: inherit; font-size: 1.05rem; padding: 10px 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--bg1); color: var(--text); letter-spacing: .2em; }
  .hold form button { padding: 0 16px; border-radius: 12px; background: var(--text); color: var(--bg1); font-weight: 600; }
  .dim { opacity: .35; pointer-events: none; transition: opacity .25s; }

  .toast { position: fixed; left: 50%; top: max(14px, env(safe-area-inset-top)); z-index: 20; transform: translate(-50%, -150%);
    padding: 10px 16px; border-radius: 14px; background: rgba(28,28,30,.92); color: #fff; font-size: .9rem; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,.25); transition: transform .35s cubic-bezier(.2,.85,.25,1); max-width: 90vw; }
  .toast.show { transform: translate(-50%, 0); }

  /* ---------- ordinateur : la maison entière au centre d'un panneau, les pièces à gauche ---------- */
  @media (min-width: 900px) {
    main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; grid-template-rows: auto 1fr;
      gap: 0 28px; max-width: 1500px; margin: 0 auto; padding: 0 28px 28px; min-height: 100dvh; }
    .top { grid-column: 1 / -1; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 30px 4px 20px; }
    .top .seg { margin-top: 0; }
    .rooms { grid-auto-rows: max-content; grid-column: 1; grid-row: 2; min-width: 0; padding: 4px 6px 24px; align-content: start;
      max-height: calc(100dvh - 150px); overflow-x: hidden; overflow-y: auto; }
    .wrap, .wrap.night { grid-column: 2; grid-row: 2; width: auto; margin: 0; height: calc(100dvh - 150px); min-height: 460px;
      border-radius: 30px; box-shadow: 0 12px 40px var(--shadow), inset 0 0 0 1px var(--card-line); }
    .wrap:not(.night) { background: radial-gradient(80% 75% at 50% 45%, var(--panel1) 0%, var(--panel2) 100%); }
    .sheet { left: auto; right: 56px; bottom: 56px; width: 380px; border-radius: 24px; max-height: calc(100dvh - 180px);
      padding-bottom: 22px; border: 1px solid var(--card-line); }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage, .spot, .switch::after, .toast, .seg button { transition: none !important; }
    .stage img, .glow, .strip { transition: opacity .2s ease !important; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .room, .sheet { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg1); }
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <div><h1>{{house}}</h1>
    <p class="sub" id="sub" aria-live="polite">Connexion…</p>
    <div class="pairbar" id="pairbar" hidden><span>Ce téléphone peut regarder, pas commander.</span><button id="pairOpen">Associer ce téléphone</button></div></div>
    <div class="seg" id="floors" role="tablist" aria-label="Étages" hidden></div>
  </header>
  <section class="wrap" id="wrap" aria-label="La maison vue de haut" hidden>
    <div class="stage" id="stage"></div>
  </section>
  <section class="rooms" id="rooms" aria-label="Pièces et lumières"></section>
</main>

<section class="sheet" id="sheet" role="dialog" aria-labelledby="sName" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="shead" id="shead">
    <div><h2 id="sName"></h2><p class="sroom" id="sRoom"></p></div>
    <button class="switch" id="sToggle" role="switch" aria-checked="false" aria-label="Allumer"></button>
  </div>
  <div id="sBody">
    <div id="cBright"><div class="label" id="lBright">Luminosité</div>
      <div class="bar" id="bar" role="slider" tabindex="0" aria-labelledby="lBright" aria-valuemin="1" aria-valuemax="100"><i id="barFill"></i><b id="barTxt"></b></div></div>
    <div id="cTemp"><div class="label" id="lTemp">Blanc</div>
      <div class="temp" id="temp" role="slider" tabindex="0" aria-labelledby="lTemp"><em id="tempKnob"></em></div></div>
    <div class="swatches" id="swatches" role="group" aria-label="Couleurs"></div>
  </div>
  <p class="note" id="sNote" hidden></p>
  <div class="hold" id="hold" hidden>
    <p id="holdMsg"></p>
    <form id="pinForm"><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Code de la maison" aria-label="Code de la maison"><button>Valider</button></form>
  </div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog class="fxdlg" id="fxDlg" aria-label="Réglages"><div id="fxBody"></div></dialog>
<dialog class="dlg" id="pairDlg" aria-labelledby="pairTitle">
  <form id="pairForm" method="dialog">
    <h2 id="pairTitle">Associer ce téléphone</h2>
    <p>Une seule fois par téléphone. Il faut le code de la maison.</p>
    <label for="pairWho">À qui est ce téléphone ?</label><select id="pairWho"></select>
    <label for="pairLabel">Nom du téléphone</label><input id="pairLabel" maxlength="60" placeholder="Téléphone">
    <label for="pairPin">Code de la maison</label><input id="pairPin" type="password" inputmode="numeric" autocomplete="off">
    <div class="row2"><button type="button" class="no" id="pairCancel">Annuler</button><button class="go">Associer</button></div>
  </form>
</dialog>

<script>
"use strict";
const $ = (id) => document.getElementById(id);

/* Valeur visée après un ordre : une lampe qui fond (transition) renvoie ses étapes intermédiaires ;

function kelvinRgb(k) {

  return [r, g, b].map((v) => Math.max(0, Math.min(255, Math.round(v))));

/* ---------- soleil (mode soir) ---------- */
function sunHoursUTC(date, lat, lon, rising) {
  const rad = Math.PI / 180, N = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 864e5), lh = lon / 15;
  const t = N + ((rising ? 6 : 18) - lh) / 24, M = 0.9856 * t - 3.289;
  let L = (M + 1.916 * Math.sin(M * rad) + 0.02 * Math.sin(2 * M * rad) + 282.634 + 360) % 360;
  let RA = (Math.atan(0.91764 * Math.tan(L * rad)) / rad + 360) % 360;
  RA = (RA + Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90) / 15;
  const sinD = 0.39782 * Math.sin(L * rad), cosD = Math.cos(Math.asin(sinD));
  const cosH = (Math.cos(90.833 * rad) - sinD * Math.sin(lat * rad)) / (cosD * Math.cos(lat * rad));
  if (cosH > 1 || cosH < -1) return null;
  const H = (rising ? 360 - Math.acos(cosH) / rad : Math.acos(cosH) / rad) / 15;
  return ((H + RA - 0.06571 * t - 6.622 - lh) % 24 + 24) % 24;
}
const FORCE = new URLSearchParams(location.search).get("mode");
function isNight() {
  if (FORCE === "soir") return true;
  if (FORCE === "jour") return false;
  const now = new Date(), sun = S.layout && S.layout.sun;
  if (!sun) { const h = now.getHours(); return h >= 19 || h < 7; }
  const up = sunHoursUTC(now, sun.lat, sun.lon, true), down = sunHoursUTC(now, sun.lat, sun.lon, false);
  if (up === null || down === null) return false;
  const h = now.getUTCHours() + now.getUTCMinutes() / 60;
  return up < down ? (h < up - 0.25 || h > down + 0.25) : (h > down + 0.25 && h < up - 0.25);
}

/* ---------- ressort (règle Apple : partir de la valeur affichée) ---------- */
function spring(from, to, v0, opt, onUpdate, onDone) {
  if (spring.raf) cancelAnimationFrame(spring.raf);
  if (REDUCED) { onUpdate(to); onDone && onDone(); return; }
  const k = (2 * Math.PI / opt.response) ** 2, c = 4 * Math.PI * opt.damping / opt.response;
  let x = from, v = v0, last = performance.now();
  const step = (now) => {
    const dt = Math.min(0.032, (now - last) / 1000); last = now;
    v += (-k * (x - to) - c * v) * dt; x += v * dt; onUpdate(x);
    if (Math.abs(v) < 4 && Math.abs(x - to) < 0.5) { onUpdate(to); spring.raf = 0; onDone && onDone(); return; }
    spring.raf = requestAnimationFrame(step);
  };
  spring.raf = requestAnimationFrame(step);
}

    return { ok: r.ok, status: r.status, data };
  } catch (e) { return { ok: false, status: 0, data: { error: "Maison injoignable" } }; }
}
let toastT = 0;

async function send(id, key, value) {
  const d = S.devices.get(id); if (!d || !d.points[key]) return;
  const before = JSON.stringify(d.points);
  d.points[key].value = value;
  if (typeof value === "number" || typeof value === "string") aim(id, key, value);
  if (key === "color_temp" && d.points.color_mode) d.points.color_mode.value = "ct";
  if (key === "color" && d.points.color_mode) d.points.color_mode.value = "hs";
  if (["brightness", "color", "color_temp", "effect"].includes(key) && d.points.on) d.points.on.value = true;
  if (d.points[key].access === "w") d.points[key].value = null;
  renderDevice(id);
  if (!mayCommand(d)) { dropAim(id, key); toast(locked(d) ? `${d.room} : réservé` : "Associe d'abord ce téléphone"); return; }
  const r = await api("/api/command", { method: "POST", headers: auth({ "content-type": "application/json", "x-maison-origin": "ui" }),
    body: JSON.stringify({ device_id: id, key, value, actor: "tableau" }) });
  if (!r.ok || r.status === 202) dropAim(id, key);  // rien ne change : pas de cible à tenir
  if (r.status === 202 && r.data && r.data.approval_id) {
    d.points = JSON.parse(before); renderDevice(id);
    S.hold = { id: r.data.approval_id, device: id };
    $("holdMsg").textContent = (r.data.message || "Pièce protégée").replace(/^En attente de validation : /, "") + " : entre le code de la maison.";
    $("hold").hidden = false; $("pin").focus();

    d.points = JSON.parse(before); renderDevice(id);
    if (r.status === 401) { KEY = null; await loadMe(); renderAll(); }

  }
}

function paintOff() {
  const lockedRoom = (room) => unpaired() || (!!S.me.person && S.me.deny_rooms.includes(room.trim().toLowerCase()));
  document.querySelectorAll("[data-alloff]").forEach((b) => {
    const room = b.dataset.alloff;
    const anyOn = [...S.devices.values()].some((d) => isLight(d) && (d.room || "") === room && isOn(d));
    b.disabled = !anyOn || lockedRoom(room) || b.classList.contains("busy");
  });
}
function paintRow(d) {
  const row = document.querySelector(`.dev[data-dev="${CSS.escape(d.id)}"]`); if (!row) return;
  const on = isOn(d), lk = locked(d); row.classList.toggle("on", on && !lk); row.classList.toggle("locked", lk); row.style.setProperty("--c", css(lampRgb(d)));
  row.querySelector(".s").textContent = lk ? `Réservé · ${stateText(d).toLowerCase()}` : stateText(d);
  const sw = row.querySelector(".switch"); sw.setAttribute("aria-checked", String(on)); sw.disabled = !d.online || !can(d, "on") || !mayCommand(d);
  paintOff();
}
function renderSheet() {
  const d = S.sel && S.devices.get(S.sel); if (!d) return;
  $("sName").textContent = d.name; $("sRoom").textContent = `${d.room || "Sans pièce"} · ${stateText(d).toLowerCase()}`;
  const on = isOn(d), tg = $("sToggle");
  tg.setAttribute("aria-checked", String(on)); tg.disabled = !d.online || !can(d, "on") || !mayCommand(d); tg.setAttribute("aria-label", on ? "Éteindre" : "Allumer");
  $("sBody").classList.toggle("dim", !d.online || !mayCommand(d));
  const note = locked(d) ? `${d.room} : réservé, ce profil ne peut pas le commander.` : unpaired() ? "Associe ce téléphone pour pouvoir commander." : "";
  $("sNote").textContent = note; $("sNote").hidden = !note;
  $("cBright").hidden = !can(d, "brightness");
  if (S.drag !== "brightness") paintBar(level(d), lampRgb(d));
  const ct = d.points.color_temp; $("cTemp").hidden = !can(d, "color_temp");
  if (ct && S.drag !== "color_temp") paintTemp(pv(d, "color_temp") || 3000, ct.min || 2200, ct.max || 6500);
  const mode = pv(d, "color_mode"), col = (pv(d, "color") || "").toLowerCase(), k = pv(d, "color_temp");
  const sw = PRESETS.filter((p) => (p.ct ? can(d, "color_temp") : can(d, "color")));
  $("swatches").innerHTML = sw.map((p) => {
    const rgb = p.ct ? kelvinRgb(p.ct) : hexRgb(p.c);
    const cur = hexRgb(col), near = cur && rgb.reduce((a, v, i) => a + (v - cur[i]) ** 2, 0) < 4500;
    const sel = on && (p.ct ? mode === "ct" && k && Math.abs(k - p.ct) < 250 : mode !== "ct" && near);
    return `<button style="background:${css(rgb)}" data-preset="${PRESETS.indexOf(p)}" aria-pressed="${!!sel}" aria-label="${p.name}"></button>`;
  }).join("");
}
function paintBar(v, rgb) {
  $("barFill").style.width = Math.max(4, v) + "%"; $("barTxt").textContent = `${Math.round(v)} %`;
  $("bar").setAttribute("aria-valuenow", Math.round(v));
  const light = rgb.map((c) => Math.round(c + (255 - c) * 0.6)); $("barFill").style.setProperty("--c1", css(light)); $("barFill").style.setProperty("--c2", css(rgb));
}
function paintTemp(k, lo, hi) {
  const x = Math.max(0, Math.min(1, (k - lo) / (hi - lo))); $("tempKnob").style.left = x * 100 + "%";
  $("tempKnob").style.setProperty("--k", css(kelvinRgb(k))); $("temp").setAttribute("aria-valuenow", Math.round(k));
  $("temp").setAttribute("aria-valuetext", `${Math.round(k)} kelvins`);
}
function renderDevice(id) {
  const d = S.devices.get(id); if (!d) return;
  paintLight(d); paintRow(d); paintFx(d); if (S.sel === id) renderSheet(); renderHeader();
}
function renderAll() { renderHeader(); renderFloors(); renderStage(); renderRooms(); renderSheet(); }

/* ---------- zoom sur la pièce ---------- */
function zoomTo(li) {
  const st = $("stage"), g = stageSize();
  if (!li) { S.zoom = 1; st.style.transform = ""; refreshSpots(); return; }
  const k = DESK.matches ? 1.7 : 2, sheetH = $("sheet").offsetHeight || 320, wrapTop = $("wrap").getBoundingClientRect().top;
  const visBottom = DESK.matches ? g.h : Math.min(g.h, innerHeight - sheetH - wrapTop - 8), cy = Math.max(70, visBottom / 2);
  const cx = DESK.matches ? Math.max(g.w * 0.3, (g.w - 420) / 2) : g.w / 2;  // ordinateur : à gauche du panneau de réglages
  const tx = cx - g.left - k * li.x * g.s, ty = cy - g.top - k * li.y * g.s;
  S.zoom = k; st.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`; refreshSpots();
}
function refreshSpots() { document.querySelectorAll(".spot").forEach((b) => b.style.setProperty("--inv", (1 / S.zoom).toFixed(3))); }

/* ---------- panneau du bas ---------- */
let sheetY = 0;
const sheetEl = () => $("sheet");
function setSheetY(y) { sheetY = y; sheetEl().style.transform = `translateY(${y}px)`; }
function openSheet(id) {
  const d = S.devices.get(id); if (!d) return;
  const li = S.layout && S.layout.lights.find((x) => x.device === id);
  if (li && li.floor !== S.floor) { S.floor = li.floor; renderFloors(); renderStage(); }
  const wasOpen = !!S.sel; S.sel = id; $("hold").hidden = true; S.hold = null;
  const sh = sheetEl(); sh.hidden = false; renderSheet();
  document.querySelectorAll(".spot").forEach((b) => b.classList.toggle("sel", b.dataset.dev === id));
  if (!DESK.matches && window.scrollY > 0) window.scrollTo({ top: 0, behavior: REDUCED ? "auto" : "smooth" });
  const H = sh.offsetHeight; if (!wasOpen) setSheetY(H + 20);
  spring(sheetY, 0, 0, { response: 0.32, damping: 0.86 }, setSheetY);
  zoomTo(li && li.floor === S.floor ? li : null);
}
function closeSheet(v0 = 0) {
  if (!S.sel) return; const sh = sheetEl(), H = sh.offsetHeight + 20; S.sel = null; S.hold = null;
  document.querySelectorAll(".spot.sel").forEach((b) => b.classList.remove("sel"));
  zoomTo(null);
  spring(sheetY, H, v0, { response: 0.3, damping: 1 }, setSheetY, () => { if (!S.sel) sh.hidden = true; });
}
(function sheetDrag() {
  const head = $("shead"); let start = null, hist = [];
  const grabZone = (e) => e.target.closest(".grab, .shead") && !e.target.closest("button");
  sheetEl().addEventListener("pointerdown", (e) => {
    if (!grabZone(e)) return; start = { y: e.clientY, s: sheetY }; hist = [[e.clientY, e.timeStamp]];
    if (spring.raf) cancelAnimationFrame(spring.raf); sheetEl().setPointerCapture(e.pointerId);
  });
  sheetEl().addEventListener("pointermove", (e) => {
    if (!start) return; let y = start.s + (e.clientY - start.y);
    if (y < 0) y = (y * 60) / (60 + Math.abs(y) * 0.55) * 0.55;   // bord élastique
    setSheetY(y); hist.push([e.clientY, e.timeStamp]); if (hist.length > 6) hist.shift();
  });
  const end = (e) => {
    if (!start) return; start = null;
    const [y0, t0] = hist[0], [y1, t1] = hist[hist.length - 1], v = t1 > t0 ? ((y1 - y0) / (t1 - t0)) * 1000 : 0;
    const proj = sheetY + (v / 1000) * 0.998 / (1 - 0.998), H = sheetEl().offsetHeight;
    if (proj > H * 0.45) closeSheet(v); else spring(sheetY, 0, v, { response: 0.3, damping: 0.8 }, setSheetY);
  };
  sheetEl().addEventListener("pointerup", end); sheetEl().addEventListener("pointercancel", end);
  void head;
})();

/* ---------- curseurs (1 pour 1 sous le doigt, envoi au lâcher) ---------- */
function slider(el, key, toValue, paint, fromKeyboard) {
  let active = false;
  const valueAt = (e) => { const r = el.getBoundingClientRect(); return toValue(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width))); };
  el.addEventListener("pointerdown", (e) => { const d = S.devices.get(S.sel); if (!d || !d.online) return;
    active = true; S.drag = key; el.setPointerCapture(e.pointerId); paint(valueAt(e), d); });
  el.addEventListener("pointermove", (e) => { if (active) paint(valueAt(e), S.devices.get(S.sel)); });
  const end = (e) => { if (!active) return; active = false; S.drag = null; send(S.sel, key, valueAt(e)); };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", () => { active = false; S.drag = null; renderSheet(); });
  el.addEventListener("keydown", (e) => { const d = S.devices.get(S.sel); if (!d) return; const v = fromKeyboard(d, e.key); if (v !== null) { e.preventDefault(); send(S.sel, key, v); } });
}
slider($("bar"), "brightness", (x) => Math.max(1, Math.round(x * 100)), (v, d) => paintBar(v, lampRgb(d)),
  (d, k) => (k === "ArrowRight" || k === "ArrowUp" ? Math.min(100, level(d) + 5) : k === "ArrowLeft" || k === "ArrowDown" ? Math.max(1, level(d) - 5) : null));
function ctRange(d) { const p = d.points.color_temp || {}; return [p.min || 2200, p.max || 6500]; }
slider($("temp"), "color_temp", (x) => { const d = S.devices.get(S.sel), [lo, hi] = ctRange(d); return Math.round((lo + x * (hi - lo)) / 50) * 50; },
  (v, d) => { const [lo, hi] = ctRange(d); paintTemp(v, lo, hi); },
  (d, k) => { const [lo, hi] = ctRange(d), c = pv(d, "color_temp") || 3000; return k === "ArrowRight" ? Math.min(hi, c + 200) : k === "ArrowLeft" ? Math.max(lo, c - 200) : null; });

/* ---------- gestes ---------- */
document.addEventListener("click", (e) => {
  const fo = e.target.closest("[data-fxopen]");
  if (fo) { openFx(fo.dataset.fxopen); return; }
  if (e.target.closest("[data-fxclose]") || e.target === $("fxDlg")) { $("fxDlg").close(); return; }
  const fx = e.target.closest(".fx");
  if (fx) {
    const id = fx.dataset.fx, d = S.devices.get(id), b = e.target.closest("button");
    if (b && b.dataset.fxsel) { send(id, fxKey(d, /^couleur$/), b.dataset.fxsel); return; }
    if (b && b.dataset.fxeff) { send(id, "effect", b.dataset.fxeff); return; }
    if (b && b.dataset.fxswitch) { send(id, b.dataset.fxswitch, !pv(d, b.dataset.fxswitch)); return; }
    if (b && b.dataset.fxpress) { send(id, b.dataset.fxpress, true); toast(b.textContent.trim()); return; }
  }
  const ao = e.target.closest("[data-alloff]");
  if (ao) { allOff(ao.dataset.alloff, ao); return; }
  const sc = e.target.closest("[data-scene]");
  if (sc) { runScene(sc.dataset.scene, sc); return; }
  const t = e.target.closest("[data-floor],[data-toggle],[data-open],.spot,[data-preset],#sToggle");
  if (!t) return;
  if (t.dataset.floor) { S.floor = t.dataset.floor; closeSheet(); renderFloors(); renderStage(); return; }
  if (t.dataset.toggle) { const d = S.devices.get(t.dataset.toggle); if (d) send(d.id, "on", !isOn(d)); return; }
  if (t.dataset.open) { openSheet(t.dataset.open); return; }
  if (t.classList.contains("spot")) { if (S.sel === t.dataset.dev) closeSheet(); else openSheet(t.dataset.dev); return; }
  if (t.dataset.preset) { const p = PRESETS[+t.dataset.preset]; if (p.ct) send(S.sel, "color_temp", p.ct); else send(S.sel, "color", p.c); return; }
  if (t.id === "sToggle") { const d = S.devices.get(S.sel); if (d) send(d.id, "on", !isOn(d)); }
});
$("wrap").addEventListener("click", (e) => { if (S.sel && !e.target.closest(".spot")) closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });
$("pinForm").addEventListener("submit", async (e) => {
  e.preventDefault(); if (!S.hold) return;
  const r = await api(`/api/approvals/${encodeURIComponent(S.hold.id)}`, { method: "POST", headers: auth({ "content-type": "application/json" }),
    body: JSON.stringify({ approve: true, pin: $("pin").value }) });
  $("pin").value = "";
  if (r.ok) { $("hold").hidden = true; S.hold = null; toast("Validé"); }
  else toast(r.status === 403 ? "Code incorrect" : (r.data && (r.data.message || r.data.error)) || "Refusé");
});
addEventListener("resize", () => { if (S.layout) { placeStage(); const li = S.sel && S.layout.lights.find((x) => x.device === S.sel && x.floor === S.floor); zoomTo(li || null); } });
setInterval(() => { const n = isNight(); if (n !== S.night) { S.night = n; renderStage(); } }, 60000);

async function allOff(room, btn) {
  btn.classList.add("busy"); btn.disabled = true;
  const r = await api("/api/pieces/eteindre", { method: "POST", headers: auth({ "content-type": "application/json" }), body: JSON.stringify({ room }) });
  btn.classList.remove("busy"); paintOff();
  if (r.ok) toast(r.data.held && r.data.held.length ? `${room} : en attente de validation` : `${room} : tout est éteint`);
  else toast((r.data && (r.data.message || r.data.error)) || "Refusé");
}

async function runScene(id, btn) {
  btn.disabled = true;
  const r = await api(`/api/scenes/${encodeURIComponent(id)}`, { method: "POST", headers: auth({ "content-type": "application/json" }), body: "{}" });
  btn.disabled = false;
  const name = (S.scenes.find((x) => x.id === id) || {}).name || "Ambiance";
  if (r.ok) toast(r.data.held && r.data.held.length ? `${name} : en attente de validation` : `${name} ✓`);
  else toast((r.data && (r.data.message || r.data.error)) || "Refusé");
}

document.addEventListener("change", (e) => { const x = e.target.closest("[data-fxnum]"); if (x) send(x.closest(".fx").dataset.fx, x.dataset.fxnum, Number(x.value)); });

/* ---------- association du téléphone ---------- */
async function loadMe() {
  const r = await api("/api/moi", { headers: auth() });
  if (r.ok) S.me = r.data;
  if (KEY && !S.me.person) { KEY = null; try { localStorage.removeItem("maison-cle"); } catch (e) {} }
}
$("pairOpen").addEventListener("click", () => {
  $("pairWho").innerHTML = S.me.profiles.map((n) => `<option>${esc(n)}</option>`).join("");
  $("pairLabel").value = /iPhone|Android/i.test(navigator.userAgent) ? "Téléphone" : "Ordinateur";
  $("pairPin").value = ""; $("pairDlg").showModal();
});
$("pairCancel").addEventListener("click", () => $("pairDlg").close());
$("pairForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const r = await api("/api/associer", { method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ person: $("pairWho").value, label: $("pairLabel").value, pin: $("pairPin").value }) });
  $("pairPin").value = "";
  if (!r.ok) { toast(r.status === 403 ? "Code incorrect" : (r.data && r.data.error) || "Refusé"); return; }
  KEY = r.data.key; try { localStorage.setItem("maison-cle", KEY); } catch (e) { toast("Ce navigateur ne garde pas la clé"); }
  $("pairDlg").close(); await loadMe(); renderAll(); toast(`Associé à ${r.data.person}`);
});

/* ---------- démarrage ---------- */
if ("serviceWorker" in navigator && isSecureContext) navigator.serviceWorker.register("/sw.js").catch(() => {});
(async function start() {
  await loadMe();
  const scs = await api("/api/scenes"); if (scs.ok) S.scenes = scs.data;
  const lay = await api("/api/tableau");
  if (lay.ok) { S.layout = lay.data; S.floor = lay.data.floors[0].id; S.night = isNight(); }
  const devs = await api("/api/devices");
  if (devs.ok) for (const d of devs.data) S.devices.set(d.id, d);
  renderAll();
  /* Flux en direct. Un téléphone en veille (ou Tailscale) coupe la connexion sans prévenir :
     au retour dans l'appli, ou après 40 s sans nouvelles, on se reconnecte et on recharge tout. */
  let es = null, lastMsg = Date.now(), lostT = 0, hiddenAt = 0;
  function connect() {
    if (es) es.close();
    es = new EventSource("/api/events"); lastMsg = Date.now();
    es.onmessage = (e) => {
      lastMsg = Date.now();
      const ev = JSON.parse(e.data); if (ev.type === "ping") return;
      if (ev.type === "snapshot") { S.devices = new Map(ev.devices.map((d) => [d.id, keepAims(d)])); renderAll(); }
      else if (ev.type === "device") { S.devices.set(ev.device.id, keepAims(ev.device)); renderAll(); }
      else if (ev.type === "removed") { S.devices.delete(ev.device_id); if (S.sel === ev.device_id) closeSheet(); renderAll(); }
      else if (ev.type === "state") { const d = S.devices.get(ev.device_id); if (d && d.points[ev.key] && S.drag !== ev.key) {
        const v = aimed(d.id, ev.key, ev.value); if (d.points[ev.key].value === v) return; d.points[ev.key].value = v; renderDevice(d.id); } }
      else if (ev.type === "online") { const d = S.devices.get(ev.device_id); if (d) { d.online = ev.online; renderDevice(d.id); } }
    };
    es.onerror = () => { clearTimeout(lostT); lostT = setTimeout(() => { $("sub").textContent = "Reconnexion…"; }, 4000); };
    es.onopen = () => { clearTimeout(lostT); renderHeader(); };
  }
  connect();
  setInterval(() => { if (!document.hidden && Date.now() - lastMsg > 40000) connect(); }, 5000);
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (Date.now() - hiddenAt > 2000 || Date.now() - lastMsg > 20000) { connect(); loadMe().then(renderAll); }
  });
  addEventListener("pageshow", (e) => { if (e.persisted) connect(); });
  addEventListener("online", connect);
})();
</script>
